<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>GAMES</title>

<style>

body{
  margin:0;
  font-family:Arial;
  background:radial-gradient(circle at top,#500035,#130029);
  color:white;
}

/* NAV */

nav{
  display:flex;
  gap:10px;
  padding:10px;
  background:#720050;
}

button{
  background:#7e22ce;
  border:none;
  padding:10px;
  color:white;
  border-radius:8px;
  cursor:pointer;
}

button:hover{
  background:#a855f7;
}

/* SEARCH */

input{
  padding:10px;
  width:300px;
  border-radius:10px;
  border:none;
  margin:10px;
}

/* GRID */

.grid{
  display:flex;
  flex-wrap:wrap;
  gap:15px;
  padding:20px;
}

.card{
  width:160px;
  background:rgba(206, 10, 212, 0.555);
  padding:10px;
  border-radius:12px;
  cursor:pointer;
  transition:0.3s;
}

.card:hover{
  transform:scale(1.05);
  box-shadow:0 0 20px #da0f8c;
}

.card img{
  width:100%;
  border-radius:10px;
}

small{
  opacity:0.7;
}

</style>
</head>

<body>

<nav>
  <h3>GAMES</h3>
</nav>

<input 
id="search" 
placeholder="Search games..." 
oninput="searchGames()"
>

<div id="grid" class="grid"></div>

<script>

/* ================= REAL GAMES ================= */

const realGames = [

  {
    name:"Atum Clicker",
    img:"https://img.itch.zone/aW1nLzI0ODkzNjc3LnBuZw==/315x250%23c/FYavRJ.png",
    link:"https://henriquedl20147008.itch.io/atum-clicker"
  },

  {
    name:"Black Box",
    img:"https://img.itch.zone/aW1nLzIyMTM5MDMwLnBuZw==/315x250%23c/GkWImZ.png",
    link:"https://henriquedl20147008.itch.io/black-box"
  },

  {
    name:"Platafoms",
    img:"https://img.itch.zone/aW1hZ2UvNDEzODU4My8yNTE1NDEwMC5wbmc=/347x500/TZ5c%2FN.png",
    link:"https://henriquedl20147008.itch.io/platafoms"
  },

  {
    name:"The Fall",
    img:"https://img.itch.zone/aW1nLzI3MzIwMDU5LnBuZw==/315x250%23c/ulL4nq.png",
    link:"https://henriquedl20147008.itch.io/the-fall"
  },

{
    name:"just musical forms & stupid objects",
    img:"https://img.itch.zone/aW1nLzI2NTExODgwLnBuZw==/315x250%23c/%2By8Gbu.png",
    link:"https://henriquedl20147008.itch.io/just-musical-forms"
  },

{
    name:"level editor",
    img:"https://img.itch.zone/aW1nLzI0NjYxNjM2LnBuZw==/315x250%23c/B4shNn.png",
    link:"https://henriquedl20147008.itch.io/level-editor"
  },

{
    name:"upwards remake",
    link:"https://henriquedl20147008.itch.io/upwards-remake"
  },

];

/* ================= RENDER ================= */

function render(list){

  const grid = document.getElementById("grid");

  grid.innerHTML = "";

  list.forEach(g=>{

    const div = document.createElement("div");

    div.className = "card";

    div.onclick = ()=>window.open(g.link,"_blank");

    div.innerHTML = `
      <img src="${g.img}">
      <p>${g.name}</p>
      <small>Click to open</small>
    `;

    grid.appendChild(div);
  });
}

/* ================= SEARCH ================= */

function searchGames(){

  let q = document
    .getElementById("search")
    .value
    .toLowerCase();

  let filtered = realGames.filter(g =>
    g.name.toLowerCase().includes(q)
  );

  render(filtered);
}

/* ================= INIT ================= */

render(realGames);

</script>

</body>
</html>
