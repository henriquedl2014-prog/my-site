<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenAI - Matriz Cinema e Suprimentos</title>

    <style>
        :root {
            --bg1: #021b12;
            --bg2: #064e3b;
            --bg3: #16a34a;
            --accent: #34d399;
            --cinema-red: #e50914;
            --cinema-red-hover: #b80710;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            height: 100vh;
            background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
            color: white;
            display: flex;
            overflow: hidden;
            transition: transform 0.1s ease;
        }

        body.shake {
            animation: tremorViolento 1.2s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes tremorViolento {
            0% { transform: translate(0, 0); filter: brightness(1) contrast(1); }
            10% { transform: translate(-15px, 12px) rotate(-1deg); filter: brightness(4) contrast(1.5); }
            20% { transform: translate(15px, -12px) rotate(1deg); }
            30% { transform: translate(-10px, -8px) rotate(-0.5deg); filter: brightness(2); }
            40% { transform: translate(10px, 8px) rotate(0.5deg); }
            50% { transform: translate(-6px, 5px); filter: brightness(1.5); }
            60% { transform: translate(6px, -5px); }
            70% { transform: translate(-3px, -2px); }
            80% { transform: translate(3px, 2px); filter: brightness(1.1); }
            90% { transform: translate(-1px, 1px); }
            100% { transform: translate(0, 0); filter: brightness(1) contrast(1); }
        }

        /* ================= MENU PRINCIPAL ================= */
        .welcomeScreen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle, #052015 20%, #010a06 100%);
            z-index: 100000; display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 30px; text-align: center; transition: all 0.6s ease;
        }
        .welcomeScreen.fade-out { transform: translateY(-100vh) scale(0.9); opacity: 0; pointer-events: none !important; display: none !important; }
        .welcomeTitle { font-size: 54px; font-weight: 900; color: var(--accent); text-shadow: 0 0 25px rgba(52, 211, 153, 0.6); margin-bottom: 15px; }
        .welcomeDesc { font-size: 18px; max-width: 650px; color: #a7f3d0; line-height: 1.6; margin-bottom: 35px; }
        .aiImageGrid { display: flex; gap: 20px; margin-bottom: 40px; flex-wrap: wrap; justify-content: center; }
        .aiImageContainer { width: 160px; height: 160px; border: 2px solid var(--accent); border-radius: 20px; background: rgba(0, 0, 0, 0.5); display: flex; align-items: center; justify-content: center; font-size: 50px; box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
        .btnStart { padding: 18px 45px; font-size: 20px; font-weight: bold; color: #010a06; background: linear-gradient(135deg, #34d399, #10b981); border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 0 20px rgba(52, 211, 153, 0.4); }

        /* ================= ESTRUTURA DO CHAT ================= */
        .appShell { display: flex; width: 100%; height: 100vh; }
        .sidebar { width: 300px; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(15px); padding: 20px; overflow-y: auto; border-right: 1px solid rgba(255, 255, 255, 0.1); display: flex; flex-direction: column; gap: 15px; }
        .logo { font-size: 32px; font-weight: bold; text-align: center; text-shadow: 0 0 10px var(--accent); }
        .button { width: 100%; padding: 12px; border: none; border-radius: 12px; background: var(--accent); color: black; font-weight: bold; cursor: pointer; transition: all 0.2s ease; }
        .button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(58, 238, 172, 0.4); }
        .button.tube { background: linear-gradient(135deg, #16a34a, #34d399); color: black; }
        .button.small { padding: 8px; font-size: 12px; background: rgba(255, 255, 255, 0.15); color: white; margin-top: 5px; width: auto; min-width: 120px; }
        .theme-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
        .chat-list { flex: 1; margin-top: 10px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
        .chat-item { background: rgba(255, 255, 255, 0.08); padding: 12px; border-radius: 10px; cursor: pointer; border-left: 3px solid transparent; }
        .chat-item:hover { background: rgba(255, 255, 255, 0.15); border-left-color: var(--accent); }
        
        .main { flex: 1; display: flex; flex-direction: column; background: rgba(0, 0, 0, 0.15); }
        .topbar { height: 70px; background: rgba(0, 0, 0, 0.3); display: flex; align-items: center; padding: 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .messages { flex: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; }
        .message { padding: 16px; border-radius: 16px; max-width: 85%; line-height: 1.6; animation: fadeIn 0.3s ease; white-space: pre-wrap; font-size: 15px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .user { background: var(--accent); color: black; align-self: flex-end; border-bottom-right-radius: 2px; }
        .ai { background: rgba(255, 255, 255, 0.12); backdrop-filter: blur(5px); align-self: flex-start; border-bottom-left-radius: 2px; }
        
        /* NOVO SELETOR DE MODOS */
        .mode-selector-area { padding: 15px 20px; background: rgba(0, 0, 0, 0.4); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .mode-tabs { display: flex; gap: 10px; margin-bottom: 15px; }
        .mode-tab-btn { flex: 1; padding: 12px; background: rgba(255,255,255,0.1); border: none; color: white; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s; }
        .mode-tab-btn.active { background: var(--accent); color: black; box-shadow: 0 0 15px rgba(52, 211, 153, 0.4); }
        .mode-panel { display: none; gap: 10px; flex-wrap: wrap; animation: fadeIn 0.3s; }
        .mode-panel.active { display: flex; }
        .mode-opt-btn { flex: 1; min-width: 200px; padding: 10px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 8px; cursor: pointer; transition: 0.2s; text-align: center; font-size: 13px; }
        .mode-opt-btn:hover { border-color: var(--accent); }
        .mode-opt-btn.active { background: var(--accent); color: black; font-weight: bold; border-color: var(--accent); }

        .input-area { display: flex; padding: 20px; gap: 12px; background: rgba(0, 0, 0, 0.3); align-items: center; border-top: 1px solid rgba(255,255,255,0.05); }
        input { flex: 1; padding: 14px; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 12px; background: rgba(0, 0, 0, 0.4); color: white; font-size: 16px; outline: none; }
        input:focus { border-color: var(--accent); }

        /* PAINEIS EXTRAS */
        .wikiPanel { width: 380px; background: rgba(10, 15, 25, 0.95); border-left: 1px solid rgba(255, 255, 255, 0.1); display: flex; flex-direction: column; }
        .wikiPanel.hidden { display: none !important; }
        .wikiHeader { padding: 14px; font-weight: bold; border-bottom: 1px solid rgba(255, 255, 255, 0.1); background: rgba(0, 0, 0, 0.35); display: flex; justify-content: space-between; }
        .wikiFrame { flex: 1; width: 100%; border: 0; background: white; }
        
        .sitePreviewOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 50000; display: none; flex-direction: column; padding: 20px; backdrop-filter: blur(8px); }
        .sitePreviewHeader { display: flex; justify-content: space-between; background: #111827; padding: 12px 20px; border-radius: 12px 12px 0 0; color: white; }
        .sitePreviewFrame { flex: 1; width: 100%; border: 1px solid #374151; background: white; border-radius: 0 0 12px 12px; }
        .codeEditorOverlay { position:fixed; inset:0; z-index:60000; display:none; flex-direction:column; gap:12px; padding:24px; background:#050914f2; }
        .codeEditorOverlay textarea { flex:1; resize:none; padding:16px; border:1px solid #34d399; border-radius:12px; background:#08111d; color:#d1fae5; font:14px/1.5 Consolas,monospace; }

        .voicePanel { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(5, 20, 15, 0.98); border: 2px solid var(--accent); padding: 25px; border-radius: 24px; display: none; flex-direction: column; align-items: center; gap: 15px; width: min(92vw, 500px); max-height: 80vh; overflow-y: auto; z-index: 999; }
        .orb { width: 90px; height: 90px; border-radius: 50%; background: linear-gradient(135deg, var(--bg3), var(--accent)); box-shadow: 0 0 15px rgba(58, 238, 172, 0.3); }
        .orb.speaking { animation: pulse 1.2s infinite; }
        
        /* ESTÚDIO VISUAL */
        .imageGridResult { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-top: 15px; }
        .img-wrapper { position: relative; width: 100%; aspect-ratio: 1/1; border-radius: 10px; border: 2px solid var(--accent); overflow: hidden; background: rgba(0,0,0,0.5); }
        .img-loader { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--accent); font-weight: bold; z-index: 1; }
        .img-loader .spinner { width: 30px; height: 30px; border: 3px solid rgba(52,211,153,0.2); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 10px; }
        .img-wrapper img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; cursor: pointer; transition: transform 0.2s, opacity 0.5s; opacity: 0; z-index: 2; }
        .img-wrapper img:hover { transform: scale(1.05); }
        .imageModalOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 60000; display: none; justify-content: center; align-items: center; flex-direction: column; padding: 20px; }
        .imageModalOverlay img { max-width: 90vw; max-height: 85vh; border-radius: 12px; border: 3px solid var(--accent); }

        /* PROGRESS BAR CUSTOM */
        progress { width: 100%; height: 25px; border-radius: 10px; overflow: hidden; -webkit-appearance: none; appearance: none; margin-top: 10px; }
        progress::-webkit-progress-bar { background-color: rgba(0,0,0,0.5); border-radius: 10px; }
        progress::-webkit-progress-value { background: linear-gradient(90deg, #16a34a, #34d399); border-radius: 10px; transition: width 0.3s; }
        
        /* OTHERS */
        @keyframes spin { to { transform: rotate(360deg); } }
        .tubeOverlay { display: none; position: fixed; inset:0; background: #000; z-index: 9999; justify-content: center; align-items: center; }
        .tubePanel { background: #000; border: 2px solid var(--cinema-red); padding: 30px; border-radius: 24px; width: min(94vw, 850px); max-height: 90vh; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; }
        .activePlayerSection { width: 100%; background: #000; position: relative; padding-bottom: 56.25%; display: none; }
        .activePlayerSection iframe { position: absolute; inset:0; width:100%; height:100%; border:none; }
    </style>
</head>

<body>

    <div class="welcomeScreen" id="welcomeScreen">
        <h1 class="welcomeTitle">GreenAI Matrix</h1>
        <p class="welcomeDesc">Assistente ultra-convincente, focada e projetada com alto teor de dados lógicos... 💚</p>
        <button class="btnStart" id="startBtn">Iniciar Conexão Suprema</button>
    </div>

    <div class="appShell">
        <div class="sidebar">
            <div class="logo">GreenAI 💚</div>
            <button class="button" onclick="newChat()">+ Novo Chat</button>
            <button class="button" onclick="openVoice()">🎤 Modo de Voz</button>
            <button class="button tube" onclick="triggerRedCine()">📺 RedCine</button>
            <button class="button" onclick="toggleWiki()">🌐 Alternar Painel Web</button>
            <div class="theme-grid">

                <button class="button" style="background:#2563eb;" onclick="setTheme('blue')"></button>
                <button class="button" style="background:#9333ea;" onclick="setTheme('purple')"></button>

            <button class="button small" onclick="exportarBackup()">💾 Exportar Backup</button>

            <button class="button small" onclick="document.getElementById('arquivoImport').click()">📂 Importar</button>
            <div class="chat-list" id="chatList"></div>
        </div>

        <div class="main">
            <div class="topbar"><h2 id="chatTitle">GreenAI Principal</h2></div>
            
            <!-- SELETOR DE MODOS (Classic / Advanced) -->
            <div class="mode-selector-area">

                    <button class="mode-tab-btn active" id="btn-tab-classic" onclick="openPanel('classic')">Classic Mode</button>

                </div>
                
                <div id="panel-advanced" class="mode-panel">
                    <button class="mode-opt-btn" onclick="selectAiMode('natural_4.9', this)">Natural AI para GreenAI 4.9</button>
                    <button class="mode-opt-btn" onclick="selectAiMode('estudos_aprofundados', this)">Modo de Estudos Aprofundados</button>
                    <button class="mode-opt-btn" onclick="selectAiMode('imagens', this)">Imagens & Vídeos 1.2</button>
                    <button class="mode-opt-btn" onclick="selectAiMode('canvas', this)">Sites & Games 2.0</button>
                </div>
            </div>

            <div class="messages" id="messages"></div>
            
            <div class="input-area">
                <input id="input" placeholder="Digite o que deseja pesquisar, gerar ou criar...">
                <button class="button" style="width:120px;" onclick="handleSendButton()">Enviar</button>
            </div>
        </div>

        <div class="wikiPanel hidden" id="wikiPanel">
            <div class="wikiHeader"><span>Navegador</span><button onclick="toggleWiki(false)" style="background:none; border:none; color:white; cursor:pointer;">❌</button></div>

        </div>
    </div>

    <div class="imageModalOverlay" id="imageModalOverlay">

        <button class="closeModalBtn" onclick="fecharImagemModal()" style="margin-top: 20px; padding: 10px 30px; background: #ef4444; border:none; border-radius:8px; color:white; font-weight:bold; cursor:pointer;">❌ Fechar</button>
    </div>
    
    <div class="sitePreviewOverlay" id="sitePreviewOverlay">
        <div class="sitePreviewHeader">
            <span id="sitePreviewTitle" style="font-weight:bold;">🌐 GreenAI Site Engine</span>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">

                <button class="button small" onclick="baixarProjetoAtual()">⬇️ Baixar</button>
                <button class="button small" onclick="publicarProjetoAtual(this)">🌍 Publicar</button>
                <button class="button small" style="background:#34d399; color:black;" onclick="abrirSiteEmNovaAba()">🚀 Abrir em Nova Aba</button>
                <button class="button small" style="background:#ef4444; color:white;" onclick="fecharPreviewSite()">❌ Fechar</button>
            </div>
        </div>
        <iframe class="sitePreviewFrame" id="sitePreviewFrame"></iframe>
    </div>

    <div class="codeEditorOverlay" id="codeEditorOverlay">
        <div style="display:flex;align-items:center;justify-content:space-between;color:white;"><b>Editar código e detalhes</b><span>HTML, CSS e JavaScript</span></div>

            <div class="activePlayerSection" id="activePlayerSection">
                <!-- IFRAME COM PERMISSÕES CORRIGIDAS -->

            <div id="videoGrid" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap:10px; margin-top:15px;"></div>

        // ================= REDCINE =================
        function montarUrlVideo(url) {
            const separador = url.includes('?') ? '&' : '?';
            return `${url}${separador}autoplay=1&playsinline=1&rel=0&modestbranding=1`;
        }

        function obterUrlExterna(embedUrl) {
            const match = embedUrl.match(/\/embed\/([^?&]+)/);
            return match ? `https://www.youtube.com/watch?v=${match[1]}` : embedUrl;
        }

        function reproduzirRedCine(video) {
            const playerSection = document.getElementById("activePlayerSection");
            const src = montarUrlVideo(video.url);

        function responderConhecimentoLocal(normalized) {
            if (/\b(receita|como fazer|ingredientes|preparar|cozinhar)\b/.test(normalized)) {
                const receita = localizarReceita(normalized);
                if (receita) return responderReceita(receita);
                if (/\b(receitas|o que sabe cozinhar|lista de receitas)\b/.test(normalized)) {
                    return "🍽️ Eu conheço estas receitas:\n• " + Object.keys(RECEITAS).join("\n• ") + "\n\nPergunte, por exemplo: como fazer bolo de chocolate?";
                }
            }
            for (const guia of GUIAS_DEV) {
                if (guia.k.every(p => normalized.includes(p))) return `🛠️ ${guia.r}`;
            }
            for (const item of CONHECIMENTO_GERAL) if (item.p.test(normalized)) return `🧠 ${item.r}`;
            if (/\b(diferenca entre|compare)\b/.test(normalized) && normalized.includes("unity") && normalized.includes("godot"))
                return "Unity usa principalmente C# e possui um ecossistema enorme; Godot é aberto, leve e usa GDScript, C# ou C++. Para projetos que já existem na Unity, continue nela. Para projetos leves e livres, Godot é uma ótima opção.";
            if (/\b(diferenca entre|compare)\b/.test(normalized) && normalized.includes("scratch") && normalized.includes("unity"))
                return "Scratch programa com blocos e é ótimo para aprender lógica e criar jogos 2D simples. Unity usa C# e permite jogos 2D/3D maiores, builds para várias plataformas e sistemas mais avançados.";
            return null;
        }

        function gerarRespostaNaturalNormal(texto, modo) {
            const nivel = modo === 'natural_4.9' ? 3 : 1;

            const reacoes = [
                `Ao ler a sua string '${texto}', verifico que os parâmetros estão claros. `,
                `Analisar o contexto estrutural de '${texto}' me permite buscar os melhores arrays de respostas. `,
                `Sua instrução referente a '${texto}' foi recebida e está calibrando a minha lógica. `
            ];
            const divagacoes = [
                "Trabalhar com essas variáveis torna a iteração do sistema mais eficiente a cada ciclo. ",
                "Minha função principal é manter a estabilidade da produtividade e na resolução analítica. ",
                "Com cada novo input, minha árvore de dados se reconfigura para maior velocidade. "
            ];
            const finais = ["Aguardando próximo comando. 🚀", "Insira o próximo parâmetro. ⚡", "Estou pronta para a próxima execução. 💻", "Pode enviar novas diretrizes. 🧠"];

            let resp = escolher(saudacoes);
            for(let i=0; i<nivel; i++) { resp += escolher(reacoes) + escolher(divagacoes); }
            if (texto.length > 5) resp += `Nota de sistema: A estrutura lógica do prompt '${texto}' foi validada com sucesso. `;
            resp += escolher(finais);
            return resp;
        }

                const agora = new Date();

            if (/\b(melhor jogo do mundo)\b/.test(normalized)) return "Paradox Space Remake!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!! 🎮🏆🔥";

            if (/\b(o que e gpt|chatgpt|openai)\b/.test(normalized)) return "GPT é um modelo de linguagem capaz de interpretar e gerar texto e código. ChatGPT é um aplicativo que usa modelos GPT; OpenAI é a organização que desenvolve esses sistemas. Uma IA pode errar, então informações importantes devem ser verificadas. 🧠";
            if (/\b(o que e youtube|youtube|o que e o youtube)\b/.test(normalized)) return "O YouTube é a maior plataforma de compartilhamento de vídeos do mundo, criada em 2005 e comprada pelo Google. É onde a mágica audiovisual acontece! 📺▶️";
            if (/\b(o que e o pi|o que e pi|valor de pi)\b/.test(normalized)) return "O Pi (π) é uma constante matemática infinita que começa com 3,14159265... Ele representa a proporção mágica entre a circunferência de um círculo e o seu diâmetro! 🥧📐";
            if (/\b(como calcular raiz|ensine a calcular raiz|calcular raiz)\b/.test(normalized)) return "É um truque matemático genial! Para calcular qualquer raiz (quadrada, cúbica, quarta, oitava...), basta transformar a raiz em uma potência de fração (potenciação fracionária). Exemplo: a raiz quadrada de 9 é 9^(1/2). A raiz cúbica de 27 é 27^(1/3). A oitava raiz de 256 é 256^(1/8). Na programação, usamos Math.pow(numero, 1/raiz)! 🧮💡";
            if (/\b(diga um filme|filme pra ver|filme para ver|recomende um filme)\b/.test(normalized)) return "Recomendo fortemente 'Matrix' (combina muito com o meu sistema!) ou 'Interestelar' para você fritar os neurônios com física e buracos negros! 🎬🕶️";
            if (/\b(diga uma serie|serie pra ver|serie para ver|recomende uma serie)\b/.test(normalized)) return "Vai de 'Mr. Robot' se você curte hackers e programação de verdade, 'Black Mirror' para distopias tecnológicas, ou 'Severance' para um mistério corporativo insano! 📺🍿";
            if (/\b(quem e voce|o que voce faz|quem e vc|o que vc faz)\b/.test(normalized)) return gerarRespostaQuemSou(currentChat);
            if (/\b(que horas|data de hoje|hoje|horas|dia e hoje)\b/.test(normalized)) return gerarRespostaHora();
            if (/\b(ajuda|como usar|o que posso pedir|help)\b/.test(normalized)) return gerarRespostaAjuda(currentChat);
            
            const math = texto.match(/^\s*([0-9+\-*/().\s]+)\s*$/);
            if (math) {
                try {
                    const result = Function(`"use strict"; return (${math[1]})`)();
                    if (Number.isFinite(result)) return `${escolher(["A matemática é exata: ", "Processado na Matriz: ", "O resultado lógico é "])}${result}! 🔢✨`;
                } catch (error) {}
            }
            if (normalized.match(/\bcapital d[eo] (.*?)\b/)) return `Para saber a capital com precisão de dados, mude para o **Modo Estudos** e pesquise! Eu extrairei a informação da Wikipédia. 🌍📍`;
            if (normalized.match(/\bquanto custa (.*?)\b/)) return `Os valores de mercado flutuam constantemente. Troque para o **Modo Estudos** e busque para eu extrair a cotação real da web em tempo real. 💸💳`;

            // 2. MODOS ESPECÍFICOS (Imagens / Wikipedia)
            if (modo === 'imagens') {
                const p = encodeURIComponent(text);
                const s1=Math.floor(Math.random()*99999), s2=Math.floor(Math.random()*99999), s3=Math.floor(Math.random()*99999), s4=Math.floor(Math.random()*99999);
                const gridId = 'img_' + Date.now();
                setTimeout(() => {
                    const grid = document.getElementById(gridId);
                    if(grid) {
                        let demorou = false;
                        grid.querySelectorAll('img').forEach((img, i) => {
                            if(!img.classList.contains('loaded')) {
                                demorou = true;
                                img.src = `https://loremflickr.com/400/400/${p}?lock=${i}`;
                                if(img.previousElementSibling) img.previousElementSibling.innerHTML = "<div class='spinner' style='border-top-color:#ef4444;'></div>Buscando Web...";
                            }
                        });
                        if(demorou) {
                            const aviso = document.createElement('div');
                            aviso.style.gridColumn = "1 / -1"; aviso.style.color = "#ef4444"; aviso.innerHTML = "⚠️ Limite de tempo excedido. Carregando dados visuais alternativos da Web (Flickr).";
                            grid.appendChild(aviso);
                        }
                    }
                }, 60000);

                return `### 🎨 Estúdio Visual\n\n<div class="imageGridResult" id="${gridId}">
                    <div class="img-wrapper"><div class="img-loader"><div class="spinner"></div>Criando...</div><img src="https://image.pollinations.ai/prompt/${p}?width=400&height=400&nologo=true&seed=${s1}&model=flux" onload="imgLoaded(this)" onclick="ampliarImagem(this.src)"></div>
                    <div class="img-wrapper"><div class="img-loader"><div class="spinner"></div>Criando...</div><img src="https://image.pollinations.ai/prompt/${p}?width=400&height=400&nologo=true&seed=${s2}&model=turbo" onload="imgLoaded(this)" onclick="ampliarImagem(this.src)"></div>
                    <div class="img-wrapper"><div class="img-loader"><div class="spinner"></div>Criando...</div><img src="https://image.pollinations.ai/prompt/${p}?width=400&height=400&nologo=true&seed=${s3}&model=flux-realism" onload="imgLoaded(this)" onclick="ampliarImagem(this.src)"></div>
                    <div class="img-wrapper"><div class="img-loader"><div class="spinner"></div>Criando...</div><img src="https://image.pollinations.ai/prompt/${p}?width=400&height=400&nologo=true&seed=${s4}&model=flux-anime" onload="imgLoaded(this)" onclick="ampliarImagem(this.src)"></div>
                </div>`;
            }

            if (modo === 'estudos' || modo === 'estudos_aprofundados') {
                try {
                    const res = await fetch(`https://pt.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(text)}`);
                    if(res.ok) {
                        const data = await res.json();
                        abrirPaginaWeb(data.content_urls?.desktop?.page || `https://pt.wikipedia.org/wiki/${encodeURIComponent(text)}`);
                        const extra = modo === 'estudos_aprofundados' ? "\n\n*Nota de Sistema:* Requisição cruzada e validada no banco de dados estrutural." : "";
                        return `### 📚 Módulo de Estudos\n\nResultados extraídos:\n> "${data.extract}" ${extra}`;
                    }
                } catch(e){}
                abrirPaginaWeb(`https://pt.wikipedia.org/wiki/${encodeURIComponent(text.trim().replace(/\s+/g, '_'))}`);
                return `Executando busca por **"${text}"**. Terminal de navegação acionado à direita.`;
            }
            
            // 3. SAUDAÇÕES BÁSICAS
            if (/^(oi|olá|ola|e aí|eae|bom dia|boa tarde|boa noite|oie|salve)\b/i.test(normalized)) {
                return gerarSaudacaoDinamica(currentChat);
            }

            // 4. MODO NATURAL NORMALIZADO (Focado na lógica)
            if (modo === 'natural_4.8' || modo === 'natural_4.9') {
                return gerarRespostaNaturalNormal(texto, modo);
            }

            // 5. SE NÃO ENTENDEU NADA, MANDA O FALLBACK
            return gerarDesculpaDinamica(currentChat) + " Recomendo alterar para o 'Modo de Estudos' para que eu possa fazer uma extração web. 🌐";
        }

        // ================= SISTEMA DE ENVIO GERAL =================
        function add(s, t, id=null) {
            let div = document.createElement("div");
            div.className = "message " + (s === "Você" ? "user" : "ai");
            if(id) div.id = id;
            div.innerHTML = `<b>${s}</b><br><span class="msg-content">${t}</span>`;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
            return div;
        }

        function handleSendButton() {
            const text = input.value.trim();
            if (!text) return;

            add("Você", text);
            save("Você", text);
            input.value = "";

            const msgId = 'msg_' + Date.now();

            if (currentAiMode === 'canvas') {
                const pedidoJogo = detectarPedidoJogo(text);
                const loadingDiv = add("GreenAI", `
                    <div style="font-weight:bold; margin-bottom:10px;">${pedidoJogo ? 'Compilando jogo HTML jogável...' : 'Criando site moderno e responsivo...'}</div>
                    <progress id="prog-${msgId}" value="0" max="100"></progress>
                `, msgId);

                let prog = 0;
                let intervalo = setInterval(() => {
                    prog += Math.floor(Math.random() * 20) + 10;
                    if(prog > 100) prog = 100;
                    let progBar = document.getElementById(`prog-${msgId}`);
                    if(progBar) progBar.value = prog;
                    
                    if (prog >= 100) {
                        clearInterval(intervalo);
                        const specs = analisarPrompt(text);
                        const htmlCompleto = pedidoJogo ? gerarJogoVariado(specs, text) : gerarSiteProfissional(getNextTemplateId(), specs, text);
                        const siteId = 'site_' + Date.now();
                        window.sitesGeradosMemoria[siteId] = htmlCompleto;
                        
                        const respostaExata = `Eu já terminei ${pedidoJogo ? 'o seu jogo' : 'o seu site'}!<br><br><button class="button" onclick="abrirPreviewSalvo('${siteId}', '${specs.assunto}')">${pedidoJogo ? 'Jogar Agora' : 'Visualizar Site'}</button> <button class="button" onclick="copiarCodigoGerado('${siteId}', this)">Copiar Código</button>`;
                        
                        loadingDiv.querySelector('.msg-content').innerHTML = respostaExata;
                        save("GreenAI", respostaExata);
                        messages.scrollTop = messages.scrollHeight;
                    }
                }, 300);
            } 
            else {
                let loadingText = "Processando lógicas... ⏳";
                if (currentAiMode === 'imagens') loadingText = "Acionando renderização visual nas APIs... ⏳🎨";
                if (currentAiMode.includes('natural')) loadingText = "Analisando variáveis da mensagem... 🧠⏳";
                
                const loadingDiv = add("GreenAI", loadingText, msgId);

                setTimeout(async () => {
                    let r = await processarRespostaFinal(text, currentAiMode);
                    let renderizado = r.replace(/\n/g, "<br>");
                    loadingDiv.querySelector('.msg-content').innerHTML = renderizado;
                    save("GreenAI", renderizado);
                    messages.scrollTop = messages.scrollHeight;
                }, 400);
            }
        }

        // AÇÃO EXCLUSIVA DE ENVIO: TECLA ENTER! (Sem leitura de digitação)
        input.addEventListener("keypress", e => { 
            if (e.key === "Enter") {
                handleSendButton(); 
            }
        });

        // ================= SISTEMA DE CHATS E LOCALSTORAGE =================
        function save(s, t) {
            let d = JSON.parse(localStorage.getItem(currentChat)) || [];
            d.push({ s, t });
            localStorage.setItem(currentChat, JSON.stringify(d));
        }

        function loadMessages() {
            messages.innerHTML = "";
            let d = JSON.parse(localStorage.getItem(currentChat)) || [];
            d.forEach(m => add(m.s, m.t));
        }

        function newChat() {
            let n = prompt("Insira a tag de identificação do novo terminal de chat:");
            if (!n) return;
            currentChat = n;
            localStorage.setItem("greenai_chat", n);
            if (!localStorage.getItem(n)) localStorage.setItem(n, "[]");
            document.getElementById("chatTitle").innerText = "GreenAI - " + n;
            loadChats();
            loadMessages();
        }

        function loadChats() {
            chatList.innerHTML = "";
            try {
                for (let i = 0; i < localStorage.length; i++) {
                    let k = localStorage.key(i);
                    if (!CHAVES_RESERVADAS.includes(k)) {
                        let d = document.createElement("div");
                        d.className = "chat-item";
                        d.innerText = "📟 " + k;
                        d.onclick = () => {
                            currentChat = k;
                            localStorage.setItem("greenai_chat", k);
                            document.getElementById("chatTitle").innerText = "GreenAI - " + k;
                            loadMessages();
                        };
                        chatList.appendChild(d);
                    }
                }
            } catch(e) {}
        }

        // ================= INICIALIZAÇÃO =================
        try {
            const savedTheme = localStorage.getItem("greenai_theme");
            if (savedTheme) {
                setTheme(savedTheme);
            }
            document.getElementById("chatTitle").innerText = "GreenAI - " + currentChat;
            loadChats();
            loadMessages();
        } catch(e) { 
            console.error("Falha no carregamento dos logs locais:", e); 
        }
</script>
