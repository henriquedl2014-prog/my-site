<style>

:root{
    --bg1:#004b2f;
    --bg2:#007a5a;
    --bg3:#1cc459;
    --accent:#3aeeac;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));
    color:white;
    display:flex;
    overflow:hidden;
}

/* SIDEBAR */
.sidebar{
    width:300px;
    background:rgba(0,0,0,0.5);
    backdrop-filter:blur(10px);
    padding:20px;
    overflow-y:auto;
}

.logo{font-size:40px;font-weight:bold;}

.button{
    width:100%;
    padding:12px;
    margin-top:8px;
    border:none;
    border-radius:12px;
    background:var(--accent);
    color:black;
    font-weight:bold;
    cursor:pointer;
}

.chat-list{
    margin-top:20px;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.chat-item{
    background:rgba(255,255,255,0.1);
    padding:10px;
    border-radius:10px;
    cursor:pointer;
}

/* MAIN */
.main{
    flex:1;
    display:flex;
    flex-direction:column;
}

.topbar{
    height:70px;
    background:rgba(0,0,0,0.2);
    display:flex;
    align-items:center;
    padding:20px;
}

.messages{
    flex:1;
    padding:20px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.message{
    padding:14px;
    border-radius:14px;
    max-width:700px;
}

.user{
    background:var(--accent);
    color:black;
    align-self:flex-end;
}

.ai{
    background:rgba(255,255,255,0.2);
}

/* INPUT */
.input-area{
    display:flex;
    padding:15px;
    gap:10px;
}

input{
    flex:1;
    padding:12px;
    border:none;
    border-radius:10px;
}

/* VOZ */
.voicePanel{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:rgba(0,0,0,0.9);
    padding:20px;
    border-radius:20px;
    display:none;
    flex-direction:column;
    align-items:center;
    gap:10px;
}

.orb{
    width:80px;
    height:80px;
    border-radius:50%;
    background:lightblue;
}

.orb.speaking{
    animation:pulse 1s infinite;
}

@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.3);}
    100%{transform:scale(1);}
}

img{
    max-width:100%;
    border-radius:10px;
}

</style>

/* SAVE */
function save(s,t){
let d=JSON.parse(localStorage.getItem(currentChat))||[];
d.push({s,t});
localStorage.setItem(currentChat,JSON.stringify(d));
}

/* LOAD */
function loadMessages(){
messages.innerHTML="";
let d=JSON.parse(localStorage.getItem(currentChat))||[];
d.forEach(m=>add(m.s,m.t));
}

/* ADD */
function add(s,t){
let div=document.createElement("div");
div.className="message "+(s==="Você"?"user":"ai");
// Garante que quebras de linha sejam exibidas corretamente
div.innerHTML=`<b>${s}</b><br>${t}`;
// Adiciona o elemento antes de rolar
messages.appendChild(div);
// Usa setTimeout para garantir que o scroll ocorra após renderizar
setTimeout(()=>{messages.scrollTop=messages.scrollHeight;},0);
}

/* CHATS */
function newChat(){
let n=prompt("Nome:");
if(!n)return;
currentChat=n;
localStorage.setItem("greenai_chat",n);
localStorage.setItem(n,"[]");
loadChats();
loadMessages();
}

function loadChats(){
chatList.innerHTML="";
for(let i=0;i<localStorage.length;i++){
let k=localStorage.key(i);
if(k!=="greenai_chat"){
let d=document.createElement("div");
d.className="chat-item";
d.innerText=k;
d.onclick=()=>{currentChat=k;loadMessages();};
chatList.appendChild(d);
}
}
}

/* VOZ */
function openVoice(){
voicePanel.style.display="flex";
}

function closeVoice(){
voicePanel.style.display="none";
stopOrb();
}

function startVoice(){
let SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR)return;

let rec=new SR();
rec.lang="pt-BR";
rec.start();

orb.classList.add("speaking");

rec.onresult=e=>{
input.value=e.results[0][0].transcript;
};

rec.onend=stopOrb;
}

/* SPEAK */
function speak(text){
let u=new SpeechSynthesisUtterance(text);
u.lang="pt-BR";

orb.classList.add("speaking");
u.onend=stopOrb;

speechSynthesis.speak(u);
}

function stopOrb(){
orb.classList.remove("speaking");
}
